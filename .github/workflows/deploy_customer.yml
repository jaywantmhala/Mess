name: Deploy Customer App to Google Play Store

on:
  push:
    branches:
      - main
    paths:
      - 'first_demo/**'
      - '.github/workflows/deploy_customer.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta

jobs:
  build-and-deploy:
    name: Build & Deploy Customer App AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Keystore & Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.CUSTOMER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > first_demo/android/upload-keystore.jks
          cp first_demo/android/upload-keystore.jks first_demo/android/app/upload-keystore.jks
          cat << 'EOF' > first_demo/android/key.properties
          storePassword=HungrilyFoods@2026Key
          keyPassword=HungrilyFoods@2026Key
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          cp first_demo/android/key.properties first_demo/android/app/key.properties
          echo "Verifying restored keystore:"
          keytool -list -v -keystore first_demo/android/upload-keystore.jks -storepass HungrilyFoods@2026Key | grep -i "SHA1:"

      - name: Install Dependencies
        working-directory: first_demo
        run: flutter pub get

      - name: Auto-Determine Version & Auto-Increment Build Number
        working-directory: first_demo
        run: |
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD_NUM=$(( ${{ github.run_number }} + 100 ))
          echo "BUILD_NAME=$PUBSPEC_VER" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV
          echo "Auto-Release Customer App: $PUBSPEC_VER (Build $BUILD_NUM)"

      - name: Build Release App Bundle (AAB)
        working-directory: first_demo
        run: flutter build appbundle --release --android-skip-build-dependency-validation --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.zenqube.hungrilyfoods
          releaseFiles: first_demo/build/app/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'production' }}
          status: completed
