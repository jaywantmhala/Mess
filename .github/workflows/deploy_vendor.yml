name: Deploy Vendor App to Google Play Store

on:
  push:
    branches:
      - main
    paths:
      - 'vendor_app/**'
      - '.github/workflows/deploy_vendor.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta

jobs:
  build-and-deploy:
    name: Build & Deploy Vendor App AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Keystore & Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.VENDOR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > vendor_app/android/upload-keystore.jks
          cp vendor_app/android/upload-keystore.jks vendor_app/android/app/upload-keystore.jks
          printf "storePassword=HungrilyFoods@2026Key\nkeyPassword=HungrilyFoods@2026Key\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" > vendor_app/android/key.properties
          cp vendor_app/android/key.properties vendor_app/android/app/key.properties
          echo "Verifying Vendor Keystore:"
          keytool -list -v -keystore vendor_app/android/upload-keystore.jks -storepass HungrilyFoods@2026Key | grep -i "SHA1:"

      - name: Install Dependencies
        working-directory: vendor_app
        run: flutter pub get

      - name: Auto-Determine Version & Auto-Increment Build Number
        working-directory: vendor_app
        run: |
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD_NUM=$(( ${{ github.run_number }} + 100 ))
          echo "BUILD_NAME=$PUBSPEC_VER" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV
          echo "Auto-Release Vendor App: $PUBSPEC_VER (Build $BUILD_NUM)"

      - name: Build Release App Bundle (AAB)
        working-directory: vendor_app
        run: flutter build appbundle --release --android-skip-build-dependency-validation --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Verify Signed AAB Certificate
        run: |
          echo "Verifying signature certificate in generated AAB:"
          keytool -printcert -jarfile vendor_app/build/app/outputs/bundle/release/*.aab | grep -i "SHA1:"

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.zenqube.hungrilyfoodsvendor
          releaseFiles: vendor_app/build/app/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'production' }}
          status: completed
